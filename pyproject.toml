[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "uv-mcp"
version = "0.2.0"
description = "Model Context Protocol (MCP) server for interacting with Python installations via uv"
readme = "README.md"
license = { text = "MIT" }
authors = [ { name = "Yago Riveiro", email = "yago.riveiro@gmail.com" } ]
requires-python = ">=3.14"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastmcp>=3.4.6,<4",
  "packaging>=26.3",
  "pydantic-settings>=2.14.2",
  "typer>=0.27.1",
  "uv>=0.12.2",
]
optional-dependencies.dev = [ "mypy", "pytest" ]
urls."Bug Tracker" = "https://github.com/yriveiro/uv-mcp/issues"
urls.Homepage = "https://github.com/yriveiro/uv-mcp"
scripts.uv-mcp = "uv_mcp.cli:run"

[dependency-groups]
dev = [
  "pyproject-fmt>=2.27",
]

[tool.hatch]
build.sources.src = "src"
build.targets.wheel.packages = [ "src/uv_mcp" ]

[tool.ruff]
target-version = "py314"
line-length = 88
format.quote-style = "double"
lint.select = [ "B", "E", "F", "I", "SIM", "UP" ]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.python_files = "test_*.py"
